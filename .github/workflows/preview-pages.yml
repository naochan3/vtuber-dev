name: 改良アバターのブラウザプレビュー
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 固定版の公式ビューアを取得
        run: |
          git clone --no-checkout https://github.com/852wa/Anime2.5DRig.git upstream
          git -C upstream checkout 7ddbd9943ea3152561b3dc8348fd752c850f3e95
      - name: 調整を適用して公開用ファイルを組み立て
        run: |
          python scripts/apply-rig-tuning.py --source upstream/lib/app.js --manifest patches/motion-v2.json
          python scripts/apply-rig-tuning.py --source upstream/lib/face-features.js --manifest patches/face-tracking-v5.json
          node --check upstream/lib/app.js
          node --check upstream/lib/face-features.js
          node tests/face-tracking.test.cjs upstream/lib/face-features.js
          node tests/motion-profile.test.cjs upstream/lib/app.js upstream/lib/face-features.js
          node tests/torso-motion.test.cjs upstream/lib/app.js
          node tests/eye-hair-motion.test.cjs upstream/lib/app.js upstream/lib/runtime.js
          npm --prefix upstream run test:node
          mkdir _site
          cp upstream/index.html upstream/LICENSE upstream/eye_close.psd upstream/mouth_close.psd upstream/sample.psd upstream/sample2.psd _site/
          cp -R upstream/lib _site/lib
          cp -R avatars _site/avatars
          python - <<'PY'
          import os
          from pathlib import Path
          page = Path('_site/index.html')
          source = page.read_text(encoding='utf-8')
          for name in ('app.js', 'face-features.js'):
              old = 'src="lib/' + name + '"'
              assert source.count(old) == 1
              source = source.replace(old, 'src="lib/' + name + '?revision=' + os.environ['GITHUB_SHA'] + '"')
          page.write_text(source, encoding='utf-8')
          PY
          test -f _site/avatars/base-speaking-v2.psd
          test -f _site/avatars/base-speaking-v2.rig.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesに公開
        id: deployment
        uses: actions/deploy-pages@v4
